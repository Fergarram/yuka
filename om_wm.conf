#
# om_wm settings
#
# Read at startup and re-read while running: save the file and the change lands
# on the next frame. Super+R reloads on demand. One key = value per line, # for
# comments, unknown keys are reported and ignored.
#
# Defaults are what the binary ships with (src/settings.rs); a key removed here
# falls back to that rather than to zero.
#

# Which code drives the trackpad: custom (our raw evdev gestures, touch.rs) or
# libinput. Applied when the device is opened, so this one needs a restart.
trackpad_mode = custom

#
# Trackpad: pointer
#

# Cursor pixels per device unit of finger travel.
pointer_sens = 0.135
# How far a finger must travel, as a fraction of the pad, before it moves the
# cursor at all. This is what stops a click dragging the pointer off target.
pointer_start_frac = 0.008
# Pointer acceleration, as the two ends of a ramp.
#
# One sensitivity has to serve two jobs that want opposite things: crossing the screen,
# where the finger should cover ground, and landing on something small, where it should
# not. Tuned for the first the second overshoots, tuned for the second your hand runs out
# of pad.
#
# So the gain follows how fast the finger is moving. pointer_slow_factor is what
# pointer_sens is multiplied by when the finger is barely moving, and
# pointer_full_speed_frac is the speed at which it reaches full sensitivity, measured in
# pad widths per second. In between it ramps linearly.
#
# This only ever slows the cursor down, never past pointer_sens, so a long fast movement
# feels exactly as it did. 1.0 for the factor turns it off entirely.
#
#   0.5 / 1.0   half speed for fine work, full speed at a brisk flick
#   0.3 / 1.5   much more precision, and a longer reach before it opens up
pointer_slow_factor = 0.5
pointer_full_speed_frac = 1.0
# And how long the cursor is parked either side of a click, in seconds. Raise it
# if a click still moves the pointer; lower it if a click-drag feels stuck.
press_freeze_secs = 0.12
# How long every finger may stay on the pad and still count as a tap rather than a
# gesture, in seconds. How far they may travel is move_start_frac, the same threshold a
# pan arms at, so a contact either moves something or stays a tap and never both.
#
# Used by the three-finger double tap, which brings the window under the cursor to you.
# Short on purpose: too long and a hand that lands, hesitates and lifts starts moving
# your view around.
tap_max_secs = 0.25
# And how far its fingers may drift and still be a tap, as a fraction of the pad.
#
# Its own allowance rather than move_start_frac, which is a two-finger pan threshold and
# far too tight for three fingers. Measured on this pad: real three-finger taps drift 35
# to 316 units, swipes start around 960, and the pan's 81 sat in the middle of the taps,
# which is why half of them did not land. 0.06 is about 400 units, clear of both.
tap_move_frac = 0.06

#
# Trackpad: two-finger gestures
#

# Canvas units panned per device unit of finger travel, for a pan with two fingers or
# three. Three fingers pan and pinch the canvas whatever the keyboard is doing; two do the
# same only while Super is held, and otherwise scroll whatever is under the pointer.
pan_sens = 0.12
# A multiplier on that for scroll that lands in a window rather than on the canvas.
# The same gesture has two destinations: the canvas moves under your fingers one to
# one, while a page usually wants to move further than they do. 1.0 sends a window
# exactly what the canvas would have panned; 2.0 scrolls a page twice as fast without
# touching how the canvas feels.
window_scroll_sens = 0.3
# How much the sideways part of a finger scroll has to be doing, relative to the part
# going the way you meant, before a window hears about it at all.
#
# Fingers travelling up a pad wander sideways, and some clients resolve one axis at a
# time and end up reading the wander instead of the scroll: ghostty in mouse reporting
# mode, which is what tmux puts it in, hears nothing at all when both axes arrive
# together. So the axis that leads at the start of a gesture holds it alone, until the
# other one is doing real work, at which point both are sent and a map or a wide page
# scrolls in two dimensions as it should.
#
# Judged over the last handful of frames rather than the whole gesture, so turning a
# corner without lifting your fingers opens it up. 0 always sends both, which is what
# om_wm did before this existed. Larger is stickier: 1.0 wants the sideways travel to
# match the other axis before it counts. The canvas is never locked either way.
scroll_axis_lock_frac = 0.25
# Travel before a pan or a pinch does anything, as a fraction of the pad. The pan
# one is also how far a two-finger tap may drift and still count as a tap.
move_start_frac = 0.012
pinch_start_frac = 0.02
# And how far three fingers must travel to count as a swipe: up for the overview, down to
# come back to 1:1. Larger than a pan threshold on purpose, because a swipe is a command
# rather than a motion being followed, and firing one by accident costs you your place.
#
# The swipe fires when you lift, not when you cross this, so going further than it is
# allowed and simply pulls the view further along. What this number decides is how far you
# have to have gone by the time you let go.
swipe_frac = 0.05
# What a three-finger swipe turns the view around: false is the middle of the screen,
# true is the cursor.
#
# The middle is the default because a swipe moves the whole canvas rather than a piece
# of it. It says "show me everything" or "put me back", and where the cursor happens to
# be resting is not what the gesture is about.
#
# true holds whatever you are pointing at exactly where it is while the scale changes
# around it, which is the rule a pinch follows. Pick it if you want the swipe to be a
# faster way of doing what a pinch does, rather than a different kind of move.
swipe_zoom_at_cursor = true
# How much pan or pinch has to lead the other to take over, and the noise floor
# below which neither counts. Raise mode_bias to make the modes stickier.
mode_bias = 1.6
mode_eps_frac = 0.0015
# Pinch motion ignored around the current finger distance, so a pan does not
# wobble the zoom.
pinch_deadzone_frac = 0.0005
# While two fingers pan, the distance a pinch is measured against creeps toward where
# they actually are. Two fingers dragged across a pad drift apart on their own, and a
# distance remembered from where they landed eventually reads that drift as a pinch,
# which is a pan that zooms a little for no reason. Letting it creep forgives the
# drift; a real pinch is much faster and still counts.
#
# As a fraction of the gap per frame:
#   0      never creeps, which is what om_wm did before this existed
#   0.05   closes half the drift in about a fifth of a second
#   0.2    forgives a lot of drift, but wants a brisk pinch to notice one
zoom_ref_follow = 0.5

#
# Trackpad: how much contact counts as a touch
#
# In the raw units the overlay's "size" line shows (this pad reports 0..2048).
# A contact smaller than touch_min_size is ignored completely: it does not point,
# does not count toward a gesture, and cannot decide a button. Once counted, it is
# only dropped when it falls under touch_drop_size, so a contact hovering around
# the threshold does not flicker in and out.
#
# Both default to 0, which switches this off. Read your own numbers off the
# overlay first (Super+P, watch the size line for a fingertip against a graze),
# then set touch_min_size below the lightest touch you want to keep.
#
# touch_drop_size must be under touch_min_size; if it is not, it becomes 70% of it.

touch_min_size = 128
touch_drop_size = 0

#
# Trackpad: resting fingers
#
# A hand rests on the pad. A finger that sits in the bottom of it and stops
# moving is parked: it does not steer the cursor, does not count toward the
# two-finger gesture test, and does not decide which button a click is. Both
# conditions are needed, or a slow-moving finger down there would be ignored.
#
# The zone is measured up from the bottom edge, so 0.4 is the bottom 40%. Set it
# to 0 to switch the whole idea off.

rest_zone_frac = 0.3
# How long a finger must sit still to count as parked, in seconds.
rest_secs = 0.1
# And how far it has to move to be awake again, as a fraction of the pad.
rest_move_frac = 0.008

#
# Trackpad: software buttons
#
# Only used on a clickpad, where the whole surface is one button and there is no
# right button to read. Measured from the bottom edge, split across it.

button_strip = 0.3333
button_split = 0.5

#
# Mouse
#

# Mac-natural scrolling: content follows the fingers. Also decides the direction
# clients are told to scroll, so the canvas and the app agree.
invert_scroll = true
# Canvas pixels panned per horizontal wheel notch, at zoom 1.
hwheel_pan = 60.0
# Pixels a client is told to scroll per wheel notch.
wheel_step_px = 15.0
# Gap within which a second middle click counts as a double click, milliseconds.
double_click_ms = 400

#
# Debugging
#
# Settings rather than environment variables, so they can be turned on while om_wm is
# running and off again without restarting it. Save the file and the next frame has them.
#
# What they report is our reading of the pad rather than the raw event stream: raw events
# say what the kernel sent, these say what we made of it and why.

# Every contact, and whether it counted as a tap, with the numbers it was judged on.
debug_taps = false
# Any frame that moves the cursor further than a hand could have, with every slot's id and
# state at that instant. For the teleport that only happens sometimes.
debug_jumps = false

#
# Windows
#

# Smallest a Super+right-drag will ask a window to be, in canvas units. Clients
# that declared their own minimum through set_min_size keep it; this is the floor
# for the ones that did not.
#
# A drag stretches the window locally so the corner tracks the cursor exactly, and
# asks the client for the same size in parallel so its contents keep reflowing. The
# stretch shrinks toward 1.0 as the client's buffer catches up.
resize_min_px = 120.0
# Whether a drag stretches the window locally while the client catches up.
#
# Off is the conventional Wayland behaviour and the default: the window is whatever size
# the client last committed, so the corner reaches your cursor only once the client has
# answered. Nothing on screen is ever a size the window is not, which means no overshoot
# past a minimum the client will refuse, and no snap back when you let go.
#
# On, the quad is scaled to your cursor while the client catches up, so the corner tracks
# your hand exactly and the contents are resampled until the client re-renders into them.
resize_stretch = false
# How often the client is asked to re-render during a drag: the next ask waits for it
# to answer the last one, or for this many frames, whichever comes first. This does
# not affect how the corner tracks your cursor, only how fresh the pixels inside are.
resize_wait_frames = 0

# Whether to draw what a client padded around its window, which is where its shadow
# and its rounded corners live.
#
# A toolkit commits a surface larger than the window it declares, and we cannot ask it
# to stop: the ones that do this do not implement server-side decorations. So the only
# choice is whether to show what is already in the buffer. false crops to the window,
# which slices the shadow off square and fills the rounded corners back in. true draws
# the whole surface, so shadows fall across whatever is behind them.
#
# Only the drawing changes. Clicks, drags, placement and maximizing all still work on
# the window itself, so the padding can never be clicked.
draw_shadows = true

# Whether a window being shrunk gets a mip chain, sampled trilinear with anisotropy.
#
# It measurably reduces the shimmer on minified text. It used to be off because only
# textures we own can carry a chain, so half the canvas would have had it and half would
# not: a dmabuf sampled in place has one level, the client's own buffer, and there is
# nowhere to put the smaller ones. dmabuf_blit_below is what closes that gap.
#
# false is also the way to spend nothing on this. It switches off the copy below as well,
# since that copy exists only to make a chain possible, so a machine that would rather have
# the memory and the fill rate than the sharpness turns off one key and pays for neither.
mips_when_minified = true

# The zoom below which a dmabuf window is copied into a texture of our own, so it can carry
# a chain like an shm one.
#
# The copy is what a chain costs and this is when it is worth paying. At 1:1 and above
# nothing is being minified, so a chain buys nothing and sampling the client's buffer in
# place is free. Below this the window is being shrunk, which is where the shimmer lives.
#
# Once per commit rather than per frame: a window that is not redrawing pays once and then
# nothing at all. A client redrawing every frame while you are zoomed out pays every frame,
# which is the case to watch. 0 switches it off entirely.
dmabuf_blit_below = 0.9

# What happens to a client's dmabuf once we have imported it. The reload is live, so the
# two can be compared inside one session by saving this file.
#
#   hold   Sample the client's buffer in place and keep it until a newer one arrives. No
#          copy of any kind. Nothing tears, but the buffer is out of the client's rotation
#          while we have it, and the texture is not ours so it cannot carry a mip chain.
#   blit   Copy the imported image into a texture of our own, then hand the buffer back at
#          once. One GPU side copy per commit: no CPU, no readback, nothing like the shm
#          path. The client never waits on us, nothing tears, and the texture is ours, so
#          dmabuf windows can carry a mip chain. Measured at about three times the slow
#          frame rate on this machine, so it is a zoom quality trade rather than free.
#
# A format that imports but is not colour renderable cannot be copied out of; blit falls
# back to hold for that window on its own.
dmabuf_mode = hold

#
# Camera
#

# Breathing room around a window the view is fitted to, in screen pixels per side.
#
# Only the camera moves. The window is never resized and never told anything about it.
#
# Only for a window too big for the screen, where the fit is ours rather than the window's.
# A maximized window is fitted exactly whatever this says, because it was given the shape of
# the screen and one with a gap around it is not maximized, it is just a large window.
#
# 0 fits exactly either way. Hot-reloads like everything else, so try a few numbers against
# a window that is genuinely too big for the screen.
fit_padding_px = 20.0

# Keyboard zoom rate, for Super with plus or minus.
zoom_rate_per_sec = 2.0
# Zoom limits, and the scale the resets return to.
zoom_min = 0.1
zoom_max = 8.0
zoom_default = 1.0
# The other scale, and the boundary between the two ways of working.
#
# The zoom only ever comes to rest here or at zoom_default, so which one it rests at is the
# mode. Out here the canvas owns everything: no window takes focus, hears the pointer or
# receives a key, and two fingers pan and pinch without asking Super. In there the windows
# are applications again and Super borrows the pointer for the canvas.
#
# Where a three-finger swipe up takes the view, and the far end of what Super+Escape toggles
# between. Nothing else settles here: a pinch is left wherever you let it go, at any scale
# between zoom_min and zoom_max.
overview_zoom = 0.4
# Perspective field of view in degrees: larger means more parallax when a window
# is lifted.
fov_deg = 40.0

# The spring that carries the view when something sends it somewhere: the three-finger
# swipes, the 1:1 detent, and being sent to a window by Super with a double click or a
# three-finger double tap. A pinch is never followed by a journey, and neither is
# Super+Escape.
#
# Written as a frequency and a damping ratio rather than a stiffness and a friction,
# because those two are the ones you can feel. spring_hz is how fast it wants to move,
# roughly the round trips a second it would make with no damping at all. spring_damping is
# how much of that oscillation survives:
#
#   1.0   critically damped: the fastest arrival with no overshoot at all
#   0.8   a small overshoot and settle, which reads as weight
#   0.5   a visible bounce
#   1.5   heavy and slow, arriving from one side
#
# The two together decide how long a journey takes; there is no separate duration. One
# spring drives both the scale and the pan, so they cannot fall out of step, and when it
# overshoots they overshoot together.
spring_hz = 3.5
spring_damping = 0.65

# And the same pair for the three-finger swipes, which want a different character.
#
# A swipe already had its motion: your fingers made it, and the spring only finishes what
# they started or takes it back, so bounce there reads as the view arguing with your hand.
# Being sent to a window is the opposite, a motion the view makes on its own, and a little
# overshoot is what gives that weight.
#
# The 1:1 detent stays on the pair above, being a correction rather than either of these.
swipe_spring_hz = 2.5
swipe_spring_damping = 0.8

# How much of the way to its destination a three-finger swipe shows you while your fingers
# are still moving, and how hard a swipe with nowhere to go pulls before it comes back.
#
# The destinations are fixed: up is always overview_zoom and down is always 1:1. The drag is
# not aiming at anything, it is there so the gesture feels like something under your hand
# and so lifting early can take it back. Under 1 on purpose, so letting go still has
# somewhere to spring to and committing is something you feel rather than a motion that
# merely stops.
#
# The dry pull is what a swipe does when the view is already where that swipe would send
# it: it gives way a little and springs back, which answers the gesture without pretending
# to have done something. A fraction of the current scale.
#
#   0.7 / 0.06   follows most of the way, a small give when there is nowhere to go
#   0.4 / 0.10   more resistance, more obvious rubber band
#   0.0 / 0.0    no preview at all, the way it worked before this existed
swipe_preview_frac = 0.7
swipe_dry_frac = 0.06
# And how far past the destination it can be pulled, as a fraction of the distance to it.
#
# The end of a rubber band rather than a wall. Up to the trigger the view follows at
# swipe_preview_frac of your travel; past it every further millimetre buys less than the one
# before, approaching this and never reaching it. So a hand that keeps going is always
# answered by something, and there is no distance at which the gesture goes dead. The two
# pieces meet at the trigger with the same slope, so you cannot feel where resistance
# starts.
swipe_stretch_frac = 0.5
# And how hard it fights on the way there. swipe_stretch_frac says how far it can ever be
# pulled; this says how much work the pulling is. Two different questions, and until now
# only the first could be asked.
#
#   1.0   gives at the same rate it did before the goal, then eases off. No felt change
#   2.0   the give halves the moment you pass the goal, which you can feel
#   5.0   a firm step into resistance, close to the old wall but never quite one
#
# The change in give at the goal is deliberate rather than a seam to be smoothed away: a
# detent you can feel is how a hand knows it has passed something without looking.
swipe_resist = 4.0

# How close to zoom_default the zoom may sit and still be carried the rest of the way,
# as a difference in scale. 0.05 means anything between 0.95 and 1.05 eases to 1.0,
# around wherever the pointer is, so nothing slides.
#
# A zoom of 0.98, or of 1.0004, costs every window on screen a resample and shows
# nothing for it: the pixel grid disengages and text softens at a scale nothing was
# aiming for. Checked every frame, whatever moved the zoom, because a pinch ending is
# only one of the ways to arrive beside 1:1. Fingers actively pinching are the
# exception: the band is theirs to move through while they are asking.
#
# This is a detent, not a mode. It only pulls toward zoom_default and only from inside
# the band. Everywhere else the zoom is still a place you are. 0 switches it off.
zoom_detent = 0.05

#
# Windows: which corner a resize holds
#
# A resize drag can change corners without letting go: whichever side of the window the
# cursor is on is the side that moves. Splitting the window down the middle makes that
# too easy to trigger, because shrinking inward walks the cursor toward the middle and
# crossing it hands the drag over just as you are getting somewhere.
#
# So the corner you grabbed keeps this much of each axis for as long as that drag lasts,
# and the boundary moves out of its way. Start in the bottom right and the split sits a
# quarter of the way in, leaving that corner three quarters of the window on both axes.
#
# 0.5 is an even split and no bias. Values near 1.0 make it very hard to change corners.
resize_corner_hold = 0.75
