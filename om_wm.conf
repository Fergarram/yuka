#
# om_wm settings
#
# Read at startup and re-read while running: save the file and the change lands
# on the next frame. Super+R reloads on demand. One key = value per line, # for
# comments, unknown keys are reported and ignored.
#
# Defaults are what the binary ships with (src/settings.rs); a key removed here
# falls back to that rather than to zero.
#

# Which code drives the trackpad: custom (our raw evdev gestures, touch.rs) or
# libinput. Applied when the device is opened, so this one needs a restart.
trackpad_mode = custom

#
# Trackpad: pointer
#

# Cursor pixels per device unit of finger travel.
pointer_sens = 0.135
# How far a finger must travel, as a fraction of the pad, before it moves the
# cursor at all. This is what stops a click dragging the pointer off target.
pointer_start_frac = 0.008
# And how long the cursor is parked either side of a click, in seconds. Raise it
# if a click still moves the pointer; lower it if a click-drag feels stuck.
press_freeze_secs = 0.12

#
# Trackpad: two-finger gestures
#

# Canvas units panned per device unit of finger travel, for a pan with two fingers or
# three. Three fingers pan and pinch the canvas whatever the keyboard is doing; two do the
# same only while Super is held, and otherwise scroll whatever is under the pointer.
pan_sens = 0.12
# A multiplier on that for scroll that lands in a window rather than on the canvas.
# The same gesture has two destinations: the canvas moves under your fingers one to
# one, while a page usually wants to move further than they do. 1.0 sends a window
# exactly what the canvas would have panned; 2.0 scrolls a page twice as fast without
# touching how the canvas feels.
window_scroll_sens = 0.3
# How much the sideways part of a finger scroll has to be doing, relative to the part
# going the way you meant, before a window hears about it at all.
#
# Fingers travelling up a pad wander sideways, and some clients resolve one axis at a
# time and end up reading the wander instead of the scroll: ghostty in mouse reporting
# mode, which is what tmux puts it in, hears nothing at all when both axes arrive
# together. So the axis that leads at the start of a gesture holds it alone, until the
# other one is doing real work, at which point both are sent and a map or a wide page
# scrolls in two dimensions as it should.
#
# Judged over the last handful of frames rather than the whole gesture, so turning a
# corner without lifting your fingers opens it up. 0 always sends both, which is what
# om_wm did before this existed. Larger is stickier: 1.0 wants the sideways travel to
# match the other axis before it counts. The canvas is never locked either way.
scroll_axis_lock_frac = 0.25
# Travel before a pan or a pinch does anything, as a fraction of the pad. The pan
# one is also how far a two-finger tap may drift and still count as a tap.
move_start_frac = 0.012
pinch_start_frac = 0.02
# And how far three fingers must travel to count as a swipe: up for the overview, down to
# come back to 1:1. Larger than a pan threshold on purpose, because a swipe is a command
# rather than a motion being followed, and firing one by accident costs you your place.
swipe_frac = 0.15
# How much pan or pinch has to lead the other to take over, and the noise floor
# below which neither counts. Raise mode_bias to make the modes stickier.
mode_bias = 1.6
mode_eps_frac = 0.0015
# Pinch motion ignored around the current finger distance, so a pan does not
# wobble the zoom.
pinch_deadzone_frac = 0.0005
# While two fingers pan, the distance a pinch is measured against creeps toward where
# they actually are. Two fingers dragged across a pad drift apart on their own, and a
# distance remembered from where they landed eventually reads that drift as a pinch,
# which is a pan that zooms a little for no reason. Letting it creep forgives the
# drift; a real pinch is much faster and still counts.
#
# As a fraction of the gap per frame:
#   0      never creeps, which is what om_wm did before this existed
#   0.05   closes half the drift in about a fifth of a second
#   0.2    forgives a lot of drift, but wants a brisk pinch to notice one
zoom_ref_follow = 0.5

#
# Trackpad: how much contact counts as a touch
#
# In the raw units the overlay's "size" line shows (this pad reports 0..2048).
# A contact smaller than touch_min_size is ignored completely: it does not point,
# does not count toward a gesture, and cannot decide a button. Once counted, it is
# only dropped when it falls under touch_drop_size, so a contact hovering around
# the threshold does not flicker in and out.
#
# Both default to 0, which switches this off. Read your own numbers off the
# overlay first (Super+P, watch the size line for a fingertip against a graze),
# then set touch_min_size below the lightest touch you want to keep.
#
# touch_drop_size must be under touch_min_size; if it is not, it becomes 70% of it.

touch_min_size = 128
touch_drop_size = 0

#
# Trackpad: resting fingers
#
# A hand rests on the pad. A finger that sits in the bottom of it and stops
# moving is parked: it does not steer the cursor, does not count toward the
# two-finger gesture test, and does not decide which button a click is. Both
# conditions are needed, or a slow-moving finger down there would be ignored.
#
# The zone is measured up from the bottom edge, so 0.4 is the bottom 40%. Set it
# to 0 to switch the whole idea off.

rest_zone_frac = 0.3
# How long a finger must sit still to count as parked, in seconds.
rest_secs = 0.1
# And how far it has to move to be awake again, as a fraction of the pad.
rest_move_frac = 0.008

#
# Trackpad: software buttons
#
# Only used on a clickpad, where the whole surface is one button and there is no
# right button to read. Measured from the bottom edge, split across it.

button_strip = 0.3333
button_split = 0.5

#
# Mouse
#

# Mac-natural scrolling: content follows the fingers. Also decides the direction
# clients are told to scroll, so the canvas and the app agree.
invert_scroll = true
# Canvas pixels panned per horizontal wheel notch, at zoom 1.
hwheel_pan = 60.0
# Pixels a client is told to scroll per wheel notch.
wheel_step_px = 15.0
# Gap within which a second middle click counts as a double click, milliseconds.
double_click_ms = 400

#
# Windows
#

# Smallest a Super+right-drag will ask a window to be, in canvas units. Clients
# that declared their own minimum through set_min_size keep it; this is the floor
# for the ones that did not.
#
# A drag stretches the window locally so the corner tracks the cursor exactly, and
# asks the client for the same size in parallel so its contents keep reflowing. The
# stretch shrinks toward 1.0 as the client's buffer catches up.
resize_min_px = 120.0
# Whether a drag stretches the window locally while the client catches up.
#
# Off is the conventional Wayland behaviour and the default: the window is whatever size
# the client last committed, so the corner reaches your cursor only once the client has
# answered. Nothing on screen is ever a size the window is not, which means no overshoot
# past a minimum the client will refuse, and no snap back when you let go.
#
# On, the quad is scaled to your cursor while the client catches up, so the corner tracks
# your hand exactly and the contents are resampled until the client re-renders into them.
resize_stretch = false
# How often the client is asked to re-render during a drag: the next ask waits for it
# to answer the last one, or for this many frames, whichever comes first. This does
# not affect how the corner tracks your cursor, only how fresh the pixels inside are.
resize_wait_frames = 0

# What happens to a client's dmabuf once we have imported it. The reload is live, so the
# two can be compared inside one session by saving this file.
#
#   hold   Sample the client's buffer in place and keep it until a newer one arrives. No
#          copy of any kind. Nothing tears, but the buffer is out of the client's rotation
#          while we have it, and the texture is not ours so it cannot carry a mip chain.
#   blit   Copy the imported image into a texture of our own, then hand the buffer back at
#          once. One GPU side copy per commit: no CPU, no readback, nothing like the shm
#          path. The client never waits on us, nothing tears, and the texture is ours, so
#          dmabuf windows can carry a mip chain. Measured at about three times the slow
#          frame rate on this machine, so it is a zoom quality trade rather than free.
#
# A format that imports but is not colour renderable cannot be copied out of; blit falls
# back to hold for that window on its own.
dmabuf_mode = hold

#
# Camera
#

# Keyboard zoom rate, for Super with plus or minus.
zoom_rate_per_sec = 2.0
# Zoom limits, and the scale the resets return to.
zoom_min = 0.1
zoom_max = 8.0
zoom_default = 1.0
# The other scale, and the boundary between the two ways of working.
#
# The zoom only ever comes to rest here or at zoom_default, so which one it rests at is the
# mode. Out here the canvas owns everything: no window takes focus, hears the pointer or
# receives a key, and two fingers pan and pinch without asking Super. In there the windows
# are applications again and Super borrows the pointer for the canvas.
#
# Where a three-finger swipe up takes the view, and the far end of what Super+Escape toggles
# between. Nothing else settles here: a pinch is left wherever you let it go, at any scale
# between zoom_min and zoom_max.
overview_zoom = 0.5
# Perspective field of view in degrees: larger means more parallax when a window
# is lifted.
fov_deg = 40.0

# How fast the view travels when a gesture sends it somewhere, as a fraction of the distance
# remaining per second. Only the swipes and Super+Escape send it anywhere; a pinch is never
# followed by a journey. Set it to 0 to make them jump rather than travel.
zoom_ease_rate = 12.0

# How close to zoom_default a pinch may finish and still be carried the rest of the
# way, as a difference in scale. 0.05 means anything between 0.95 and 1.05 lands on
# 1.0 when your fingers lift, easing there around wherever the pointer was.
#
# A pinch left at 0.98 costs every window on screen a resample and shows nothing for
# it: the pixel grid disengages and text softens, at a scale no hand was aiming for.
# This is a detent, not a mode. It only pulls toward zoom_default, only from inside
# the band, and only when a pinch ends. Everywhere else the zoom is still a place you
# are. 0 switches it off.
zoom_detent = 0.05

#
# Windows: which corner a resize holds
#
# A resize drag can change corners without letting go: whichever side of the window the
# cursor is on is the side that moves. Splitting the window down the middle makes that
# too easy to trigger, because shrinking inward walks the cursor toward the middle and
# crossing it hands the drag over just as you are getting somewhere.
#
# So the corner you grabbed keeps this much of each axis for as long as that drag lasts,
# and the boundary moves out of its way. Start in the bottom right and the split sits a
# quarter of the way in, leaving that corner three quarters of the window on both axes.
#
# 0.5 is an even split and no bias. Values near 1.0 make it very hard to change corners.
resize_corner_hold = 0.75
