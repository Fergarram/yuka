# Which xdg-desktop-portal backend answers what, in a yuka session (XDG_CURRENT_DESKTOP=yuka).
#
# Installed by lua/desktop.lua as ~/.config/xdg-desktop-portal/yuka-portals.conf.
#
# The gtk backend serves Settings (color-scheme, read from gsettings
# org.gnome.desktop.interface color-scheme, which lua/looks.lua writes), file choosers and the
# rest. It needs xdg-desktop-portal and xdg-desktop-portal-gtk installed.

[preferred]
default=gtk
